# Builds stardew3ds.3dsx with devkitPro's official image and publishes it as a
# release ("build-N"). The .3dsx is only the engine; game files come from your
# own copy via tools/convert.py.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: XNB reader / LZX / texture writer
        run: |
          python3 tests/make_xnb_samples.py /tmp/xnbs
          gcc -O2 -c source/third_party/stb_impl.c -o /tmp/stbi.o
          g++ -std=c++17 -O2 -Wall -Isource tests/xnb_test.cpp source/setup/xnb.cpp source/setup/lzx.cpp source/setup/s3t_write.cpp /tmp/stbi.o -o /tmp/xnb_test
          /tmp/xnb_test /tmp/xnbs
          python3 tests/xnbpy_test.py /tmp/xnbs   # the converter's reader for normal game files
      - name: Sound (XACT reader, MS-ADPCM, engine)
        run: |
          python3 tests/make_xact_samples.py /tmp/xact
          mkdir -p /tmp/xact/root/audio /tmp/xact/root/data
          cp /tmp/xact/test.xwb /tmp/xact/test.xsb /tmp/xact/root/audio/
          gcc -O2 -c source/third_party/stb_vorbis.c -o /tmp/stbv.o
          g++ -std=c++17 -O2 -Wall -Isource tests/audio_test.cpp source/audio/*.cpp source/core/vfs.cpp /tmp/stbv.o -o /tmp/audio_test
          /tmp/audio_test /tmp/xact
      - name: Game rules
        run: |
          pip install pillow numpy
          python3 tests/make_fake_content.py /tmp/fake
          python3 tools/convert.py "/tmp/fake/Content (unpacked)" /tmp/fakeout
          g++ -std=c++17 -O2 -Isource -Isource/core tests/craft_test.cpp source/core/*.cpp -o /tmp/craft_test
          g++ -std=c++17 -O2 -Isource -Isource/core tests/core_test.cpp source/core/*.cpp -o /tmp/core_test
          /tmp/craft_test /tmp/fakeout/3ds/stardew3ds/
          /tmp/core_test /tmp/fakeout/3ds/stardew3ds/
          # a PC save brought over (a made-up save shaped like the real XML)
          python3 tools/saveimport.py tests/fixtures/pc_save/Farmer_123 /tmp/fakeout/3ds/stardew3ds
          grep -q "^name	Farmer" /tmp/fakeout/3ds/stardew3ds/import.txt
  build-3dsx:
    needs: host-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: stardew3ds
          path: |
            stardew3ds.3dsx
            stardew3ds.elf
            stardew3ds.smdh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: stardew3ds build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          body: |
            Engine build from ${{ github.sha }}. Copy stardew3ds.3dsx to sdmc:/3ds/ and your
            converted files to sdmc:/3ds/stardew3ds/ (see the README).
          files: stardew3ds.3dsx


  # makerom's Linux build needs a newer glibc than devkitPro's image, so the
  # .cia is packed on the plain runner from the .elf the 3dsx job built.
  cia:
    needs: build-3dsx
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stardew3ds
      - name: Build the .cia (HOME Menu install, e.g. FBI's QR install)
        env:
          GH_API_TOKEN: ${{ github.token }}   # signed-in API calls don't hit the anonymous rate limit
        run: |
          # bannertool moved from Steveice10 to diasurgical: find the current release
          BT=$(curl -sSf -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/diasurgical/bannertool/releases/latest | grep -o 'https://[^"]*\.zip' | head -1)
          echo "bannertool: $BT"
          curl -sSfL -o /tmp/bt.zip "$BT"
          unzip -o -q /tmp/bt.zip -d /tmp/bt
          find /tmp/bt -type f | head -20
          install -m755 "$(find /tmp/bt -type f -name bannertool -path '*linux-x86_64*' | head -1)" /usr/local/bin/bannertool
          MR=$(curl -sSf -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/3DSGuy/Project_CTR/releases/latest | grep -o 'https://[^"]*makerom[^"]*ubuntu[^"]*\.zip' | head -1)
          echo "makerom: $MR"
          curl -sSfL -o /tmp/mr.zip "$MR"
          unzip -o -q /tmp/mr.zip -d /tmp/mr
          install -m755 "$(find /tmp/mr -name makerom -type f | head -1)" /usr/local/bin/makerom
          bannertool makebanner -i meta/banner.png -a meta/banner.wav -o banner.bnr
          bannertool makesmdh -s "stardew3ds" -l "stardew3ds - Ported by ItsRaiden" -p "ItsRaiden" -i icon.png -o icon.icn
          makerom -f cia -o stardew3ds.cia -elf stardew3ds.elf -rsf meta/cia.rsf -icon icon.icn -banner banner.bnr -target t -DAPP_VERSION_MAJOR=1
          ls -la stardew3ds.cia
      - name: Publish with the build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: stardew3ds build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: stardew3ds.cia

  converter-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # Chaquopy builds the app's Python with this
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install the NDK, retried (its download sometimes arrives broken)
        run: |
          SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1)/sdkmanager"
          for i in 1 2 3; do
            yes | "$SDKM" "ndk;26.1.10909125" > /tmp/ndk.log 2>&1 && break
            echo "NDK install attempt $i failed"; tail -3 /tmp/ndk.log; sleep 10
          done
      - name: Build the converter APK
        run: gradle -p android assembleRelease --stacktrace
      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk stardew3ds-converter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stardew3ds-converter
          path: stardew3ds-converter.apk
      - name: Publish with the build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: stardew3ds build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: stardew3ds-converter.apk
