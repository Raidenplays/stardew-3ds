# Builds stardew3ds.3dsx with devkitPro's official image and publishes it as a
# release ("build-N"). The .3dsx is only the engine; game files come from your
# own copy via tools/convert.py.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: XNB reader / LZX / texture writer
        run: |
          python3 tests/make_xnb_samples.py /tmp/xnbs
          gcc -O2 -c source/third_party/stb_impl.c -o /tmp/stbi.o
          g++ -std=c++17 -O2 -Wall -Isource tests/xnb_test.cpp source/setup/xnb.cpp source/setup/lzx.cpp source/setup/s3t_write.cpp /tmp/stbi.o -o /tmp/xnb_test
          /tmp/xnb_test /tmp/xnbs
      - name: Sound (XACT reader, MS-ADPCM, engine)
        run: |
          python3 tests/make_xact_samples.py /tmp/xact
          mkdir -p /tmp/xact/root/audio /tmp/xact/root/data
          cp /tmp/xact/test.xwb /tmp/xact/test.xsb /tmp/xact/root/audio/
          gcc -O2 -c source/third_party/stb_vorbis.c -o /tmp/stbv.o
          g++ -std=c++17 -O2 -Wall -Isource tests/audio_test.cpp source/audio/*.cpp source/core/vfs.cpp /tmp/stbv.o -o /tmp/audio_test
          /tmp/audio_test /tmp/xact
      - name: Game rules
        run: |
          pip install pillow numpy
          python3 tests/make_fake_content.py /tmp/fake
          python3 tools/convert.py "/tmp/fake/Content (unpacked)" /tmp/fakeout
          g++ -std=c++17 -O2 -Isource -Isource/core tests/craft_test.cpp source/core/*.cpp -o /tmp/craft_test
          g++ -std=c++17 -O2 -Isource -Isource/core tests/core_test.cpp source/core/*.cpp -o /tmp/core_test
          /tmp/craft_test /tmp/fakeout/3ds/stardew3ds/
          /tmp/core_test /tmp/fakeout/3ds/stardew3ds/
  build-3dsx:
    needs: host-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: stardew3ds
          path: |
            stardew3ds.3dsx
            stardew3ds.smdh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: stardew3ds build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Engine build from ${{ github.sha }}. Copy stardew3ds.3dsx to sdmc:/3ds/ and your
            converted files to sdmc:/3ds/stardew3ds/ (see the README).
          files: |
            stardew3ds.3dsx

  converter-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # Chaquopy builds the app's Python with this
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build the converter APK
        run: gradle -p android assembleRelease --stacktrace
      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk stardew3ds-converter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stardew3ds-converter
          path: stardew3ds-converter.apk
      - name: Publish with the build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: stardew3ds build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: stardew3ds-converter.apk
